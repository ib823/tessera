name: Build & Deploy to Cloudflare Pages

on:
  push:
    branches: [main, codex/t4a-revamp]
    paths-ignore:
      - 'radar/**'
      - 'docs/**'
      - '*.md'
      - 'logo-concepts/**'
      - 'audit/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  # Manual trigger — useful for re-syncing the social bot card index
  # to KV after editing an issue without making a code commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.60.0 cannot
    # install chromium ("Playwright does not support chromium on
    # ubuntu26.04-x64"), which stopped the job before the Cloudflare deploy.
    # Unpin when @playwright/test is upgraded to a release that supports it.
    runs-on: ubuntu-24.04
    # The seven browser projects and the three-engine responsive matrix run
    # against the same signed build before it can deploy. This is a ceiling.
    timeout-minutes: 120
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      GIT_DIR: ${{ github.workspace }}/.git

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare FORA application from canonical content
        run: npm --prefix revamp run prepare

      - name: Typecheck
        working-directory: revamp/.cache/app
        run: npm run check

      - name: Lint
        working-directory: revamp/.cache/app
        run: npm run lint

      - name: Test
        working-directory: revamp/.cache/app
        run: npm test

      - name: Verify font licence exception boundaries
        run: npm --prefix revamp run check:license-gate

      - name: Validate signing secret
        env:
          TFA_PRIVATE_KEY_B64: ${{ secrets.TFA_PRIVATE_KEY_B64 || secrets.SIGNING_KEY_BASE64 }}
          TFA_PRIVATE_KEY_PEM: ${{ secrets.TFA_PRIVATE_KEY_PEM }}
        run: |
          if [ -z "$TFA_PRIVATE_KEY_B64" ] && [ -z "$TFA_PRIVATE_KEY_PEM" ]; then
            echo "Missing signing secret. Configure TFA_PRIVATE_KEY_B64 or TFA_PRIVATE_KEY_PEM."
            exit 1
          fi

      - name: Build
        working-directory: revamp/.cache/app
        run: npm run build
        env:
          TFA_PRIVATE_KEY_B64: ${{ secrets.TFA_PRIVATE_KEY_B64 || secrets.SIGNING_KEY_BASE64 }}
          TFA_PRIVATE_KEY_PEM: ${{ secrets.TFA_PRIVATE_KEY_PEM }}

      - name: Bundle-size budget
        working-directory: revamp/.cache/app
        run: npm run check-bundle

      - name: Verify published signatures
        working-directory: revamp/.cache/app
        run: npm run check-signatures

      - name: Stage the exact built output for responsive tests
        run: cp -a revamp/.cache/app/dist revamp/dist

      - name: Install Playwright browsers
        # Normally about four minutes. A stalled download or apt lock once held
        # this step for over an hour; fail it instead of the whole job budget.
        timeout-minutes: 20
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Playwright e2e (all seven browser and device projects)
        working-directory: revamp/.cache/app
        run: npm run e2e
        env:
          CI: 'true'

      - name: Responsive matrix and CSS breakpoint sweeps (Chromium, Firefox, WebKit)
        run: npm --prefix revamp run test:matrix
        env:
          CI: 'true'
          FORA_BROWSERS: chromium,firefox,webkit

      - name: First-load JavaScript and initial network budgets
        run: node revamp/scripts/check-first-load.mjs --local

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            revamp/.cache/app/playwright-report
            revamp/.cache/app/test-results
            revamp/playwright-report
            revamp/test-results
          retention-days: 7

      - name: Extract commit subject
        id: msg
        run: |
          SUBJECT=$(echo "$COMMIT_MSG" | head -1 | tr -d '"')
          echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}

      # A feature-branch push can exercise the real signing/deployment secrets
      # without changing main, the production origin, workers or their KV data.
      - name: Deploy FORA preview to Cloudflare Pages
        id: preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/t4a-revamp'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy revamp/dist --project-name=thefourthangle --branch=codex-t4a-revamp

      - name: Record preview deployment
        if: steps.preview.outcome == 'success'
        run: |
          echo "Deployment URL: $URL"
          echo "Deployment ID: $ID"
          echo "Environment: $ENVIRONMENT"
          echo "Branch alias: $ALIAS"
          echo "Source commit: $GITHUB_SHA"
          { echo "### FORA preview"; echo; echo "- URL: $URL"; echo "- Deployment ID: $ID"; echo "- Environment: $ENVIRONMENT"; echo "- Commit: $GITHUB_SHA"; } >> "$GITHUB_STEP_SUMMARY"
        env:
          URL: ${{ steps.preview.outputs.deployment-url }}
          ID: ${{ steps.preview.outputs.pages-deployment-id }}
          ENVIRONMENT: ${{ steps.preview.outputs.pages-environment }}
          ALIAS: ${{ steps.preview.outputs.pages-deployment-alias-url }}

      # The exact public output that was deployed, so the hosted byte checks can
      # be repeated independently. revamp/dist holds only published site files.
      - name: Retain deployed preview output
        if: steps.preview.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: fora-preview-dist
          path: revamp/dist
          retention-days: 7

      - name: Verify hosted preview routes, signatures, headers and worker access
        if: steps.preview.outcome == 'success'
        run: |
          node revamp/scripts/check-hosted.mjs "$FORA_PREVIEW_URL"
          node revamp/scripts/check-first-load.mjs "$FORA_PREVIEW_URL"
        env:
          # Use the immutable hexadecimal deployment URL. The existing workers
          # intentionally do not allow named branch aliases as CORS origins.
          FORA_PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy revamp/dist --project-name=thefourthangle --branch=main --commit-message="${{ steps.msg.outputs.subject }}"

      - name: Verify production routes, signatures, headers and worker access
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node revamp/scripts/check-hosted.mjs https://thefourthangle.pages.dev
          node revamp/scripts/check-first-load.mjs https://thefourthangle.pages.dev

      # ── Push-notification Worker (workers/notify/) ──
      # Deployed from the repo on every push to main so the live Worker never
      # drifts from the code the Disclaimer describes (weekly cap, 90-day
      # retention). Its secrets (VAPID keys) are stored in Cloudflare and are
      # kept by `wrangler deploy`. Runs after the Pages deploy and does not
      # block it: a failure here shows as a warning annotation on the run.
      - name: Deploy notify Worker
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/notify
          command: deploy

      # ── Social bot Worker (workers/social/) ──
      # Skips cleanly until the operator runs the one-time setup:
      #   1. cd workers/social && npx wrangler kv namespace create T4A_SOCIAL_KV
      #   2. paste the returned id into workers/social/wrangler.toml
      #   3. npx wrangler secret put BLUESKY_APP_PASSWORD
      #   4. npx wrangler secret put ADMIN_SECRET
      #   5. commit the updated wrangler.toml
      # After that, every push to main re-deploys the Worker and uploads the
      # latest cards:index to KV.
      - name: Check social Worker configured
        id: social_check
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if grep -q "REPLACE_WITH_KV_NAMESPACE_ID" workers/social/wrangler.toml; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::social Worker not yet configured — skipping deploy. See workers/social/wrangler.toml comments."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy social Worker
        if: steps.social_check.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/social
          command: deploy

      - name: Upload cards:index to KV
        if: steps.social_check.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/social
          # `--remote` is the default on wrangler v3 (the runner toolchain
          # version); the flag itself was only added in wrangler v4 and
          # errors out with "Unknown argument: remote" on v3.
          command: kv key put --binding T4A_SOCIAL_KV cards:index --path ../../revamp/.cache/app/public/social-card-index.json

      - name: Upload radar:current to KV
        if: steps.social_check.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/social
          # Generated by scripts/build-radar-summary.mjs into engine/private/
          # (gitignored; never published). Worker reads via getRadar() at
          # post-decision time. If the summary is missing, the kv put fails
          # softly — scorer falls back to trends-only.
          command: kv key put --binding T4A_SOCIAL_KV radar:current --path ../../revamp/.cache/app/engine/private/radar-summary.json
