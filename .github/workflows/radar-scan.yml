name: T4A Radar Scan

on:
  push:
    branches: [main]
    paths:
      - 'radar/**'
      - '!radar/output/**'
      - '.github/workflows/radar-scan.yml'
  schedule:
    # Every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:
    # Manual trigger button in GitHub UI

permissions:
  contents: write  # Needed to commit state back to repo

defaults:
  run:
    shell: bash

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Kill if stuck

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'radar/requirements.txt'

      - name: Install dependencies
        run: pip install -r radar/requirements.txt pytest

      - name: Test Radar
        run: python -m pytest radar/tests/ -q --disable-warnings

      - name: Run radar scan
        env:
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          mkdir -p radar/output/logs
          date -u +'%Y-%m-%dT%H:%M:%SZ' > "$RUNNER_TEMP/radar-scan-started-at"
          python radar/run-radar.py --once 2>&1 | tee radar/output/logs/last-cycle.log

      - name: Check scan health
        if: always()
        run: python radar/scripts/check-health.py --started-at-file "$RUNNER_TEMP/radar-scan-started-at"

      - name: Refresh X posting inventory
        if: success()
        run: |
          # Regenerates social/x-inventory.{json,md} from published issues +
          # fresh radar signals. Preserves POSTED status. Plain Node, no deps.
          node scripts/build-x-inventory.mjs || echo "x-inventory build skipped"

      - name: Commit updated state and results
        if: success()
        run: |
          git config user.name "Fourth Angle Radar"
          git config user.email "fourthangle@proton.me"

          # Add radar output files
          git add radar/output/state.json || true
          git add radar/output/issue-queue.json || true
          git add radar/output/health.json || true
          git add radar/output/foreign-events.json || true
          git add radar/output/silence-watch.json || true
          git add radar/output/silence-watch.md || true
          git add radar/output/logs/last-cycle.log || true
          # X posting inventory (refreshed each scan)
          git add social/x-inventory.json || true
          git add social/x-inventory.md || true

          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "radar: scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
